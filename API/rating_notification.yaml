openapi: 3.0.3

info:
  title: CAB System - Rating & Notification API
  description: API đánh giá và thông báo
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Rating
    description: Đánh giá chuyến xe
  - name: Notification
    description: Thông báo

paths:

  /trips/{tripId}/rating:
    post:
      tags:
        - Rating
      summary: Đánh giá chuyến xe
      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/TripId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'

      responses:
        '201':
          description: Đánh giá thành công

        '400':
          description: Chuyến xe chưa hoàn tất hoặc đã được đánh giá

    get:
      tags:
        - Rating
      summary: Xem đánh giá chuyến xe
      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/TripId'

      responses:
        '200':
          description: Thành công

  /drivers/{driverId}/ratings:
    get:
      tags:
        - Rating
      summary: Xem đánh giá tài xế
      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/DriverId'

      responses:
        '200':
          description: Danh sách đánh giá

  /notifications:
    get:
      tags:
        - Notification
      summary: Xem thông báo
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Danh sách thông báo

  /notifications/{notificationId}/read:
    put:
      tags:
        - Notification
      summary: Đánh dấu thông báo đã đọc
      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/NotificationId'

      responses:
        '200':
          description: Cập nhật thành công

  /notifications/read-all:
    put:
      tags:
        - Notification
      summary: Đánh dấu tất cả thông báo đã đọc
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Cập nhật thành công

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer

    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: integer

    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer

  schemas:

    RatingRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Tài xế thân thiện và đúng giờ
