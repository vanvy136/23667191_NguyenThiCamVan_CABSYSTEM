openapi: 3.0.3

info:
  title: CAB System - Authentication API
  description: API xác thực và quản lý tài khoản
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Authentication
    description: Xác thực người dùng
  - name: Account
    description: Quản lý tài khoản

paths:

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '401':
          description: Sai tài khoản hoặc mật khẩu

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Đăng xuất
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Đăng xuất thành công

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Làm mới access token
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Làm mới token thành công

  /accounts/{accountId}:
    get:
      tags:
        - Account
      summary: Xem thông tin tài khoản
      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/AccountId'

      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

        '404':
          description: Không tìm thấy tài khoản

    put:
      tags:
        - Account
      summary: Cập nhật thông tin tài khoản
      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/AccountId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'

      responses:
        '200':
          description: Cập nhật thành công

  /accounts/{accountId}/password:
    put:
      tags:
        - Account
      summary: Đổi mật khẩu
      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/AccountId'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password

      responses:
        '200':
          description: Đổi mật khẩu thành công

        '400':
          description: Mật khẩu cũ không chính xác

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        example: 1001

  schemas:

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: customer01
        password:
          type: string
          format: password
          example: password123

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        account:
          $ref: '#/components/schemas/Account'

    Account:
      type: object
      properties:
        accountId:
          type: integer
        username:
          type: string
        role:
          type: string
          enum:
            - CUSTOMER
            - DRIVER
            - OPERATOR
            - ADMIN
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED

    AccountUpdateRequest:
      type: object
      properties:
        username:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
